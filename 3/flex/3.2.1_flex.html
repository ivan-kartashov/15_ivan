<!DOCTYPE html>
<html lang="es">

<head>
    <title>3.2.1 flex HTML</title>
    <style>
        .container {
            display: flex;
            background-color: purple;
            justify-content: end;
        }

        .container div {
            background-color: orange;
            margin: 5px;
            padding: 5px;
        }

        .container2 {
            display: flex;
            flex-direction: column;
            width: 100px;
        }

        .container2 div {
            background-color: orange;
            padding: 5px;
            padding-right: 20px;
            border: 5px solid black;
        }

        #nav {
            display: flex;
            background-color: beige;
            justify-content: center;
        }

        #nav ul li {
            list-style-type: none;
            background-color: rgb(145, 22, 22);
            border: 4px solid black;
            display: inline-block;
            margin: 10px;
            padding: 10px 15px;
        }

        #nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div>Botón 1</div>
        <div>Botón 2</div>
        <div>Botón 3</div>
        <div>Botón 4</div>
    </div>
    <div class="container2">
        <div>Botón 1</div>
        <div>Botón 2</div>
        <div>Botón 3</div>
        <div>Botón 4</div>
    </div>
    <nav id="nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>

</html>
