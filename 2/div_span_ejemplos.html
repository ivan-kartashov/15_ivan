<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Apunte de div y span</title>
</head>

<body>
    <div style="background-color: hotpink;">
        <p>Esta es la caja azul</p>
        <p>Esta es la segunda linea (no es azul)</p>
    </div>
    <div style="background-color: blueviolet;">
        <p>Esta es la caja morada</p>
        <br>
        <br>
        <br>
        <p>Linea <span style="color: white;">final</span></p>
    </div>
    <div style="background-color: green;">
        <div style="background-color: yellow; float: left;">
            <p>Esta es la caja amarilla</p>
        </div>
        <div style="background-color: red; float: left;">
            <p>Esta es la caja roja</p>
        </div>
        <p>La caja verde</p>
    </div>
</body>

</html>
